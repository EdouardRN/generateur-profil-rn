<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma photo de profil RN</title><style>*{box-sizing:border-box}body{margin:0;background:#07152c;color:white;font:16px system-ui,Arial,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 48px;text-align:center}h1{font-size:clamp(26px,6vw,38px);margin:12px 0}p{color:#c9d5e8;line-height:1.5}.preview{max-width:480px;margin:22px auto;background:#020815;border-radius:20px;padding:12px}canvas{display:block;width:100%;aspect-ratio:1}button,.upload{display:inline-block;border:0;border-radius:12px;padding:14px 20px;font-weight:750;font-size:16px;cursor:pointer;background:#fff;color:#082453;margin:8px 4px}button.primary{background:#e51e36;color:white}input[type=file]{display:none}.controls{display:grid;gap:8px;max-width:440px;margin:15px auto}.controls label{text-align:left;color:#dce7fa}input[type=range]{width:100%;accent-color:#ed243a}small{display:block;color:#aebed4;margin-top:18px;line-height:1.5}a{color:#fff}</style></head><body><main><h1>🇫🇷 Ma photo de profil RN</h1><p>Ajoutez votre photo au cadre tricolore, ajustez-la et téléchargez votre nouvelle image de profil.</p><label class="upload" for="file">📷 Choisir ma photo</label><input id="file" type="file" accept="image/*"><div class="preview"><canvas id="canvas" width="1080" height="1080" aria-label="Aperçu de la photo de profil"></canvas></div><div class="controls"><label for="zoom">Zoom de la photo</label><input id="zoom" type="range" min="1" max="3" value="1" step="0.01"><label for="vertical">Position verticale</label><input id="vertical" type="range" min="-100" max="100" value="0"><label for="horizontal">Position horizontale</label><input id="horizontal" type="range" min="-100" max="100" value="0"></div><button id="reset">Recentrer</button><button class="primary" id="download">⬇ Télécharger en PNG</button><small>Votre photo est traitée uniquement dans votre navigateur : elle n'est pas envoyée sur un serveur. Visuel de soutien non officiel, sans affiliation revendiquée avec le parti.</small></main><script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),file=document.getElementById('file'),zoom=document.getElementById('zoom'),vertical=document.getElementById('vertical'),horizontal=document.getElementById('horizontal');let img=null;const S=1080,C=540;
function draw(){ctx.clearRect(0,0,S,S);ctx.fillStyle='#050b16';ctx.fillRect(0,0,S,S);ctx.save();ctx.beginPath();ctx.arc(C,C,513,0,Math.PI*2);ctx.clip();const bg=ctx.createLinearGradient(0,0,S,0);bg.addColorStop(0,'#0643a7');bg.addColorStop(.32,'#fff');bg.addColorStop(.66,'#f7f7f7');bg.addColorStop(1,'#df092c');ctx.fillStyle=bg;ctx.fillRect(0,0,S,S);if(img){let base=Math.max(1010/img.width,1010/img.height)*Number(zoom.value),w=img.width*base,h=img.height*base,x=C-w/2+Number(horizontal.value)*3,y=475-h/2+Number(vertical.value)*3;ctx.drawImage(img,x,y,w,h)}else{ctx.fillStyle='rgba(0,23,64,.67)';ctx.beginPath();ctx.arc(540,410,145,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(540,790,270,240,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 44px system-ui';ctx.fillText('VOTRE PHOTO',540,530)}ctx.restore();let ring=ctx.createLinearGradient(0,0,S,0);ring.addColorStop(0,'#1355ce');ring.addColorStop(.47,'#fff');ring.addColorStop(1,'#e41635');ctx.strokeStyle=ring;ctx.lineWidth=24;ctx.beginPath();ctx.arc(C,C,523,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='white';ctx.lineWidth=9;ctx.beginPath();ctx.arc(C,C,502,0,Math.PI*2);ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(C,C,497,0,Math.PI*2);ctx.clip();let banner=ctx.createLinearGradient(0,830,0,1060);banner.addColorStop(0,'#102f66');banner.addColorStop(1,'#061a3b');ctx.fillStyle=banner;ctx.fillRect(0,818,S,262);ctx.textAlign='left';ctx.fillStyle='white';ctx.font='normal 55px system-ui';ctx.fillText('Rassemblement',325,925);ctx.font='bold 80px system-ui';ctx.fillText('National',325,1015);ctx.save();ctx.translate(220,941);ctx.beginPath();ctx.moveTo(0,86);ctx.bezierCurveTo(-62,17,-15,-37,6,-105);ctx.bezierCurveTo(17,-55,52,-37,37,18);ctx.bezierCurveTo(28,56,15,70,0,86);ctx.closePath();ctx.fillStyle='white';ctx.fill();ctx.beginPath();ctx.moveTo(2,65);ctx.bezierCurveTo(-25,10,1,-25,8,-70);ctx.bezierCurveTo(32,-20,37,19,2,65);ctx.fillStyle='#ed193b';ctx.fill();ctx.restore();ctx.restore()}
file.addEventListener('change',()=>{let f=file.files?.[0];if(!f)return;let url=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;zoom.value=1;vertical.value=0;horizontal.value=0;draw();URL.revokeObjectURL(url)};i.src=url});[zoom,vertical,horizontal].forEach(e=>e.addEventListener('input',draw));document.getElementById('reset').onclick=()=>{zoom.value=1;vertical.value=0;horizontal.value=0;draw()};document.getElementById('download').onclick=()=>{if(!img){alert('Choisissez d’abord une photo.');return}const a=document.createElement('a');a.download='ma-photo-profil-RN.png';a.href=c.toDataURL('image/png');a.click()};draw();
</script></body></html>
